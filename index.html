<!DOCTYPE html>
<!--
 ASCII CITY - generative oblique ASCII city + live transport sim. Single file, no deps.

 LINUX WALLPAPER RECIPES (replace /path/to and the seed)
 1) Static PNG (feh / swww / GNOME / KDE):
    chromium --headless --disable-gpu --hide-scrollbars --window-size=3840,2160 \
      --virtual-time-budget=4000 --screenshot=/tmp/city.png \
      "file:///path/to/index.html?seed=harbor7&still=1&ui=0&hour=17&font=18"
    feh --bg-fill /tmp/city.png     # or: swww img /tmp/city.png
 2) Live borderless wallpaper (X11):
    xwinwrap -ni -fs -s -st -sp -nf -b -- chromium --app="file:///path/to/index.html?seed=harbor7&ui=0" --window-position=0,0
    or simply: chromium --app="file:///path/to/index.html?seed=harbor7&ui=0" --start-fullscreen
 3) Wayland: run the --app command above under a layer-shell wrapper (e.g. hyprpaper-live / wpaperd with a browser surface).

 URL PARAMS: seed cols rows font hour speed(.25-4) weather|w(auto,clear,rain,storm,snow,fog) traffic people water(.1-.6)
   ui grain scanlines vignette lights paused animate still modes(road,rail,water,air,foot)
 KEYS: R randomize | G regenerate | Space pause | N +1h | T +12h | 1-5 speed | W weather | H/U HUD | F fullscreen
       S save PNG | V vignette | L lights | K scanlines | J grain
 The seed + settings persist in localStorage and in ?seed=... so reopening restores the same city.
 LINKED WINDOWS: open the file in several windows (one per monitor). They find each other (BroadcastChannel), share the clock/weather,
   and cars, buses, trucks, boats, planes and trains travel between neighbouring windows according to where the windows sit on screen.
   HUD is hidden by default: press H (or add ?ui=1).
-->

 traffic:num('traffic',1,0,3),people:num('people',1,0,3),water:num('water',.3,.1,.6),
 ui:flg('ui',false),grain:flg('grain',true),scanlines:flg('scanlines',false),vignette:flg('vignette',true),lights:flg('lights',true),paused:flg('paused',false),built:num('built',.6,0,1)};

const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};

['#2f6e2a','#4f9a58','#7bbf66','#122418'],['#10441a','#4fae62','#4c9a45','#0d1d12'],['#5a4a2a','#a09484','#a8a070','#252320'],['#3a3a3a','#b4bccc','#8a8a86','#2a2c33'],
['#f0e8c8','#a4abc0','#40444c','#15171d'],['#4a4a45','#8f95a8','#b8b8b0','#262932'],['#5a2018','#d09080','#c4503c','#33201f'],['#14305a','#9fc0f0','#4a78c0','#1c2742'],
['#262d36','#b0bac8','#7f8890','#252a33'],['#1a1a22','#8a93ad','#d8d0c0','#2a2e3a'],['#3a6a96','#ffd060','#d8d0c0','#2a2e3a'],['#2a1a0a','#d8c8a8','#9a8a70','#2a2520'],
['#2a2a2a','#c8c8d8','#8a7a60','#2a2520'],['#101010','#ffe08a','#b8b8b0','#262932'],['#101010','#ffe08a','#b8b8b0','#262932'],['#101030','#f4f4ff','#c8c0a0','#3a3a45']].map(a=>a.map(hex));

/* state */
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const FONT=num('font',14,6,60);

let B=[],GM,GC,GD,GS,TC=[],gates={E:[],W:[],N:[],S:[]},gmap=[],DT=[],edgeW={E:[],W:[],N:[],S:[]},WI=0,WCl=null,lastGk=-1,rebuild=()=>{},started=false,nb={},peers={},LW=null;
let PM0,PC0,IC=0,JC=0,BGS,GCc=[],lastHw='',dirty=true,bcOK=false;

function size(){const dpr=devicePixelRatio||1;cx.font=FONT+'px monospace';CW=cx.measureText('M').width;CH=Math.round(FONT*1.15);

 if(Q.has('cols')||Q.has('rows')){cv.style.width='100vw';cv.style.height='100vh'}else{cv.style.width=W*CW+'px';cv.style.height=H*CH+'px'}
 cx.setTransform(dpr,0,0,dpr,0,0);cx.font=FONT+'px monospace';cx.textBaseline='top'}

/* generation */
function gen(){lastHw='';
 const r=mb(hs(wseed())()),N=mkNoise(r),N2=mkNoise(r),n=W*H,rc=s=>s[r()*s.length|0];

 const e=new Float32Array(n),ox=r()*40,oy=r()*40,cX=W/2,cY=H/2,dd=(x,y)=>Math.hypot((x-cX)/W,(y-cY)/H);

 let mn=1e9,mx=-1e9;for(let i=0;i<n;i++){if(e[i]<mn)mn=e[i];if(e[i]>mx)mx=e[i]}

 // roads
 const xc=(W>>1)-1,yc=(H>>1)-1;xs=[xc];ys=[yc];
 for(let x=xc+11+(r()*5|0);x<W-5;x+=11+(r()*5|0))xs.push(x);for(let x=xc-11-(r()*5|0);x>=3;x-=11+(r()*5|0))xs.unshift(x);
 for(let y=yc+8+(r()*3|0);y<H-5;y+=8+(r()*3|0))ys.push(y);for(let y=yc-8-(r()*3|0);y>=2;y-=8+(r()*3|0))ys.unshift(y);
 IC=xs.indexOf(xc);JC=ys.indexOf(yc);

 const land=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&!wt[y*W+x];
 NV=new Uint8Array(NI*NJ);EE=new Uint8Array(NI*NJ);ES=new Uint8Array(NI*NJ);
 for(let i=0;i<NI;i++)for(let j=0;j<NJ;j++){const x=xs[i],y=ys[j];NV[i*NJ+j]=land(x,y)&&land(x+1,y)&&land(x,y+1)&&land(x+1,y+1)&&dd(x,y)<.52?1:0}
 for(let i=0;i<NI;i++)for(let j=0;j<NJ;j++)if(NV[i*NJ+j]){
  if(i+1<NI&&NV[(i+1)*NJ+j]){let c=0;for(let x=xs[i]+2;x<xs[i+1];x++)for(let k=0;k<2;k++)if(!land(x,ys[j]+k))c++;if(c<=6)EE[i*NJ+j]=1}
  if(j+1<NJ&&NV[i*NJ+j+1]){let c=0;for(let y=ys[j]+2;y<ys[j+1];y++)for(let k=0;k<2;k++)if(!land(xs[i]+k,y))c++;if(c<=6)ES[i*NJ+j]=1}}
 const set=(x,y,m,c)=>{if(x<0||y<0||x>=W||y>=H)return;const i=y*W+x;mat[i]=m;ch[i]=c};

 const rd=(x,y)=>{if(x<0||y<0||x>=W||y>=H)return;const w=wt[y*W+x];set(x,y,w?15:7,w?'=':' ')};
 nodes=[];lamps=[];
 for(let i=0;i<NI;i++)for(let j=0;j<NJ;j++){const x=xs[i],y=ys[j],k=i*NJ+j;
  if(NV[k]){nodes.push([x,y,i,j]);pv(x-1,y-1);pv(x+2,y-1);pv(x-1,y+2);pv(x+2,y+2);for(let a=0;a<2;a++)for(let b=0;b<2;b++)rd(x+a,y+b)}
  if(EE[k]){for(let q=x;q<=xs[i+1]+1;q++){pv(q,y-1);pv(q,y+2)}for(let q=x+2;q<xs[i+1];q++){rd(q,y);rd(q,y+1)}}
  if(ES[k]){for(let q=y;q<=ys[j+1]+1;q++){pv(x-1,q);pv(x+2,q)}for(let q=y+2;q<ys[j+1];q++){rd(x,q);rd(x+1,q)}}}
 for(let i=0;i<NI;i++)for(let j=0;j<NJ;j++){const x=xs[i],y=ys[j],k=i*NJ+j;
  if(EE[k])for(let q=x+3;q<xs[i+1];q+=7)if(mat[(y-1)*W+q]===8){set(q,y-1,16,'!');lamps.push([q,y-1])}
  if(ES[k])for(let q=y+4;q<ys[j+1];q+=6)if(mat[q*W+x+2]===8){set(x+2,q,16,'!');lamps.push([x+2,q])}}
gates={E:[],W:[],N:[],S:[]};gmap=[];

 for(let j=0;j<NJ;j++){let a=-1,b=-1;for(let i=0;i<NI;i++)if(NV[i*NJ+j]){if(a<0)a=i;b=i}if(b>=0&&eok(b,j,-1,0))addG('E',b,j,1,0);if(a>=0&&eok(a,j,1,0))addG('W',a,j,-1,0)}
 for(let i=0;i<NI;i++){let a=-1,b=-1;for(let j=0;j<NJ;j++)if(NV[i*NJ+j]){if(a<0)a=j;b=j}if(b>=0&&eok(i,b,0,-1))addG('S',i,b,0,1);if(a>=0&&eok(i,a,0,1))addG('N',i,a,0,-1)}
 DT=[];for(let k=0;k<NI*NJ;k++){if(!NV[k]){DT.push(null);continue}const d=new Int16Array(NI*NJ).fill(-1);d[k]=0;const q=[k];

 // rail loop with stations

   pp.forEach(p=>set(p[0],p[1],14,(p[1]===y0||p[1]===y1)?'=':'|'));

 GM=mat.slice();GC=ch.slice();GD=dep.slice();GS=sh.slice();B=[];PM0=GM.slice();PC0=GC.slice();
 // buildings
 function bld(x,y,w,d,h,m){if(y-h<0||y+d>H||x+w>W||w<2)return;

  for(let yy=y-h;yy<y+d;yy++)for(let xx=x;xx<x+w;xx++){const i=yy*W+xx;if(dep[i]>dv)continue;dep[i]=dv;sh[i]=0;
   if(yy<y-h+d){mat[i]=m;ch[i]=m===9?':':m===10?'#':'='}

  if(!(NV[i*NJ+j]||NV[(i+1)*NJ+j+1]||NV[(i+1)*NJ+j]||NV[i*NJ+j+1]))continue;
  const a=xs[i]+3,b=xs[i+1]-2,c=ys[j]+3,e2=ys[j+1]-2;

   if(rur&&r()<.6){x+=4;continue}
   const w=Math.min(b-x+1,ind?6+(r()*4|0):3+(r()*3|0)),dp=Math.min(e2-c+1,ind?4:2+(r()*2|0));
   const h=d<.15?4+(r()*5|0):com?2+(r()*4|0):ind?1+(r()*2|0):rur?1:1+(r()*3|0);

hudEl.onclick=e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)key(k)};
function ov(){const f=(id,on)=>document.getElementById(id).style.display=on?'block':'none';f('sc',S.scanlines);f('vg',S.vignette);f('gr',S.grain);hud()}
(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),d=g.createImageData(128,128);
 for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);
 const el=document.getElementById('gr');el.style.backgroundImage=`url(${c.toDataURL()})`;let f=0;setInterval(()=>{el.style.backgroundPosition=(Math.random()*128|0)+'px '+(Math.random()*128|0)+'px'},90)})();

/* window linking */
const ME=Math.random().toString(36).slice(2,9),BORN=Date.now(),SD=['E','W','N','S'],OPP={E:'W',W:'E',N:'S',S:'N'},seen=new Set();let BC=null,lastNb='';
try{BC=new BroadcastChannel('asciicity-link');BC.onmessage=e=>{bcOK=true;onmsg(e.data)}}catch(e){}
addEventListener('storage',e=>{if(e.key==='ac_msg'&&e.newValue){try{onmsg(JSON.parse(e.newValue))}catch(_){}}});
try{WI=+sessionStorage.getItem('ac_world')||0}catch(e){}
function post(m){m.id=ME;m.n=Math.random().toString(36).slice(2);if(BC)try{BC.postMessage(m)}catch(e){}if(!bcOK)try{localStorage.setItem('ac_msg',JSON.stringify(m))}catch(e){}}
function send(side,d){if(nb[side])post(Object.assign({t:'x',to:nb[side],side},d))}
function hello(f){const fm=g=>Object.fromEntries(SD.map(s=>[s,g(s)]));
 post({t:'h',f:f?1:0,cx:screenX+outerWidth/2,cy:screenY+outerHeight/2,w:WI,born:BORN,hour:S.hour,wx:tgtW,wset:S.weather,sp:S.speed,pa:S.paused,
  cap:started?{t:fm(s=>!!trunkGate(s)),g:fm(s=>gates[s].length>0),w:fm(s=>edgeW[s].length>0),rail:P_.length>0}:{}})}
function linkOK(s,cap){const id=nb[s],p=id&&peers[id];if(!p||!p.cap||!p.cap.g)return false;const c=p.cap,o=OPP[s];
 return cap==='road'?!!c.g[o]:cap==='water'?!!c.w[o]:cap==='rail'?!!c.rail:true}
const linkSides=cap=>SD.filter(s=>linkOK(s,cap));
function toast(t){if(!S.ui)return;const e=document.getElementById('tt');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,2500)}
function netUpdate(){nb={};const mx=screenX+outerWidth/2,my=screenY+outerHeight/2,bd={};
 for(const id in peers){const p=peers[id];let dx=p.cx-mx,dy=p.cy-my;if(!dx&&!dy)dx=id>ME?1:-1;
  const s=Math.abs(dx)>=Math.abs(dy)?(dx>0?'E':'W'):(dy>0?'S':'N'),d=Math.hypot(dx,dy);if(!(s in bd)||d<bd[s]){bd[s]=d;nb[s]=id}}
 const key=Object.keys(nb).sort().join('');if(key!==lastNb){lastNb=key;toast(key?'linked: '+key:'unlinked')}}
function onmsg(m){if(!m||m.id===ME||seen.has(m.n))return;seen.add(m.n);if(seen.size>800)seen.clear();
 if(m.t==='h'){const nw=!peers[m.id];peers[m.id]=Object.assign(m,{seen:performance.now()});if(nw){hello(0);netUpdate()}
  if(started&&m.w===WI&&(m.born<BORN||(m.born===BORN&&m.id<ME))){const u=new Set(Object.values(peers).map(p=>p.w));WI=0;while(u.has(WI))WI++;try{sessionStorage.setItem('ac_world',WI)}catch(e){}gen();draw()}
  if(m.f||(m.born<BORN&&started)){if(Math.abs((m.hour-S.hour+36)%24-12)>.15)S.hour=m.hour;S.speed=m.sp;S.paused=m.pa;if(m.f){S.weather=m.wset;ov()}}}
 else if(m.t==='bye'){delete peers[m.id];netUpdate()}
 else if(m.t==='seed'){S.seed=m.seed;S.built=.5;if(started){gen();save()}}
 else if(m.t==='x'&&m.to===ME&&started)recv(m)}
function recv(m){const so=OPP[m.side],near=(a,f,g)=>a.reduce((b,q)=>Math.abs(g(q)-f)<Math.abs(g(b)-f)?q:b,a[0]);
 if(m.k==='v'){const gs=gates[so];if(!gs.length)return;const hh=gs.filter(q=>q.hw),g=near(hh.length?hh:gs,m.f,q=>q.f),v=mkV(m.ty,m.col,g.i*NJ+g.j,false);v.sz=m.sz;v.v=m.v;v.pt=.2;if(g.hw){v.mode=4;v.dx=-g.dx;v.dy=-g.dy;v.s=gStart(g);v.i=g.i;v.j=g.j;v.k=g.i*NJ+g.j}}
 else if(m.k==='b'){const e=edgeW[so];if(!e.length)return;const q=near(e,m.f,c=>(so==='E'||so==='W')?c[1]/H:c[0]/W);mkW(Bs,okB,q[0],q[1],m.sp,m.col)}
 else if(m.k==='p'){const dx=m.side==='E'?1:m.side==='W'?-1:0,dy=m.side==='S'?1:m.side==='N'?-1:0;
  As.push({t:0,x:dx>0?-6:dx<0?W+6:m.f*W,y:dy>0?-3:dy<0?H+3:m.f*H,dx,dy,sp:m.sp,alt:m.alt});if(As.length>12)As.shift()}
 else if(m.k==='t'){if(P_.length&&Ts.length<4)Ts.push({pos:STN[Math.random()*STN.length|0],dwell:3,col:m.col})}}
setInterval(()=>{if(frozen)return;hello(0);const t=performance.now();for(const id in peers)if(t-peers[id].seen>3500)delete peers[id];netUpdate();if(started&&hwSig()!==lastHw)setHwy();
 let Ld=null;for(const id in peers)if(peers[id].born<BORN&&(!Ld||peers[id].born<Ld.born))Ld=peers[id];LW=Ld?Ld.wx:null},1000);
addEventListener('pagehide',()=>post({t:'bye'}));
/* input */
function key(k){k=k.toLowerCase();
 if(k==='r'){S.seed=Math.random().toString(36).slice(2,8);S.built=.5;post({t:'seed',seed:S.seed});gen()}
 else if(k==='g')gen();
 else if(k===' ')S.paused=!S.paused;
 else if(k==='n')S.hour=(S.hour+1)%24;
 else if(k==='t')S.hour=(S.hour+12)%24;
 else if('12345'.includes(k)&&k)S.speed=[.25,.5,1,2,4][+k-1];
 else if(k==='w')S.weather=WS[(WS.indexOf(S.weather)+1)%WS.length];
 else if(k==='h'||k==='u')S.ui=!S.ui;
 else if(k==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}
 else if(k==='s'){draw();cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='city-'+S.seed+'.png';a.click()})}
 else if(k==='v')S.vignette=!S.vignette;else if(k==='l')S.lights=!S.lights;else if(k==='k')S.scanlines=!S.scanlines;else if(k==='j')S.grain=!S.grain;
 else return;
 ov();save();if(frozen||S.paused)draw();if('ntw12345 '.includes(k))hello(1)}
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.key===' ')e.preventDefault();key(e.key)});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{size();gen();draw()},200)});

/* boot */
size();
let last=performance.now(),acc=0,sc=0;
function start(){started=true;gen();setHwy();ov();save();
 if(frozen){for(let i=0;i<200;i++)sim(.05);draw();return}
 requestAnimationFrame(function loop(now){requestAnimationFrame(loop);acc+=Math.min(.1,(now-last)/1000);last=now;if(acc<1/30)return;sim(acc);acc=0;if(!S.paused||dirty){draw();dirty=false}if(++sc%150===0)save()})}
if(frozen)start();else{hello(0);setTimeout(()=>{const u=new Set(Object.values(peers).map(p=>p.w));if(u.has(WI)){WI=0;while(u.has(WI))WI++}
 try{sessionStorage.setItem('ac_world',WI)}catch(e){}start()},700)}
})();
</script></body></html>
